# pnpm 설정 (pnpm-workspace.yaml)
#
# allowBuilds: 설치할 때 "빌드 스크립트"를 실행해도 되는 패키지 목록이에요.
#   pnpm 12는 보안을 위해, 허락하지 않은 패키지의 설치 스크립트를 실행하지 않아요.
#   CI(--frozen-lockfile)에서는 허락 목록에 없는 스크립트가 있으면 설치 자체가 실패해요.
#   esbuild와 workerd는 내 컴퓨터에 맞는 실행 파일을 준비하는 설치 스크립트가 꼭 필요해서 허락해 둡니다.
#   새 의존성을 더한 뒤에는 `pnpm ignored-builds`로 확인하고, 필요하면 `pnpm approve-builds <패키지>`로 더해요.
allowBuilds:
  # esbuild: 코드를 묶는 도구. Next.js·Vitest·OpenNext가 안에서 써요.
  esbuild: true
  # workerd: Cloudflare Workers 런타임. 내 컴퓨터에서 Workers처럼 띄워 볼 때(pnpm cf:preview) 써요.
  workerd: true
