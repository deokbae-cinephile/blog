# 자동 검사와 배포(CI/CD) — .github/workflows/ci.yml
#
# 이 파일이 하는 일
#   1. 검사(check): main 브랜치에 올리거나(push) PR을 열 때마다 GitHub가 빈 컴퓨터를 하나 빌려
#      설치 → 보안 취약점 → 타입 검사 → 린트 → 단위 테스트(원고 형식 검사 포함) → 빌드 → E2E 테스트를 차례로 돌려요.
#      하나라도 실패하면 빨간 X가 떠서, 망가진 코드나 잘못 쓴 원고가 그대로 쌓이지 않게 막아 줘요.
#   2. 배포(deploy): main에 올라온 커밋이 검사를 통과하면 Cloudflare Workers에 올려요.
#      글쓰기 화면에서 저장한 리뷰도 main에 커밋으로 올라가서, 검사를 통과하면 몇 분 뒤 블로그에 보여요.
#      검사에 실패하면 배포하지 않아서, 블로그는 전에 올린 모습 그대로 남아요.
#
# 배포에 쓰는 값(저장소 Settings → Secrets and variables → Actions)
#   - CLOUDFLARE_API_TOKEN(비밀 값): Workers에 올릴 수 있는 Cloudflare API 토큰
#   - CLOUDFLARE_ACCOUNT_ID(변수): Cloudflare 계정 번호. 이 값이 없으면 배포 단계는 건너뛰어요.
#   글쓴이 로그인·저장에 쓰는 비밀 값은 GitHub이 아니라 Cloudflare 워커에 있어요(docs/development.md 5장).
#
# 원고를 올렸는데 빨간 X가 떴다면?
#   GitHub 저장소의 Actions 탭 → 실패한 실행 → "단위 테스트" 단계를 열면
#   어느 원고의 어디를 어떻게 고칠지 한국어로 나와 있어요.

name: CI

# 언제 실행할까요?
on:
  push:
    branches: [main] # main에 올렸을 때
  pull_request: # PR을 열거나 고쳤을 때

# 같은 브랜치에서 새로 올리면, 앞서 돌던 검사·배포는 멈추고 새 것만 돌려요(시간 절약).
# 배포가 중간에 멈춰도 Cloudflare는 다 올라간 버전으로만 바꾸므로, 블로그가 반쯤 바뀌는 일은 없어요.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 이 작업에 필요한 권한: 저장소 코드를 읽기만 해요.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest # 빌려 쓰는 컴퓨터의 운영체제
    timeout-minutes: 20 # 20분이 넘으면 멈춰요(무한히 도는 일을 막아요).
    steps:
      # 1. 저장소 코드 받기
      - uses: actions/checkout@v7

      # 2. pnpm 설치 (버전은 package.json의 packageManager를 따라요)
      - uses: pnpm/action-setup@v6

      # 3. Node.js 설치 (버전은 .node-version 파일을 따라요). 받은 라이브러리를 캐시해 다음 실행을 빠르게 해요.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      # 4. 라이브러리 설치. --frozen-lockfile: pnpm-lock.yaml과 다르면 실패해요(모두가 같은 버전을 쓰게).
      - run: pnpm install --frozen-lockfile

      # 5. 운영에 쓰는 라이브러리에 알려진 높은 위험 이상의 보안 취약점이 있으면 실패해요.
      - name: 보안 취약점 검사
        run: pnpm audit --prod --audit-level high

      # 6~8. 타입 검사, 린트, 단위 테스트(content/reviews 원고 형식 검사 포함)
      - name: 타입 검사
        run: pnpm typecheck
      - name: 린트
        run: pnpm lint
      - name: 단위 테스트
        run: pnpm test

      # 9. 실제 원고로 빌드가 되는지 확인해요(배포와 같은 빌드).
      - name: 빌드
        run: pnpm build

      # 10. E2E: 시험용 원고로 다시 빌드한 뒤, 진짜 브라우저(Chromium)로 사이트를 써 봐요.
      #     로그인·글쓰기는 가짜 GitHub 서버(e2e/mock-github.mjs)와 시험용 계정으로 시험해요(playwright.config.ts가 띄워요).
      - name: E2E용 빌드
        run: pnpm e2e:build
      - name: Playwright 브라우저 설치
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E 테스트
        run: pnpm e2e

      # 실패했을 때만, 무슨 일이 있었는지 기록(test-results)을 7일 동안 보관해요. Actions 화면에서 내려받을 수 있어요.
      - name: E2E 실패 기록 보관
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7

  deploy:
    # 검사(check)가 성공해야만 시작해요.
    needs: check
    # main에 올렸을 때만 돌아요(PR에서는 돌지 않아요). Cloudflare 계정 번호 변수가 없으면 건너뛰어요.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 1~4. 검사와 같은 준비: 코드 받기, pnpm·Node.js 설치, 라이브러리 설치
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # 5. Workers용 빌드: next build 결과를 OpenNext 어댑터가 Workers용 코드(.open-next/)로 바꿔요(open-next.config.ts).
      - name: Workers용 빌드
        run: pnpm exec opennextjs-cloudflare build

      # 6. 배포: 미리 만든 화면의 캐시를 정적 파일에 채운 뒤 wrangler로 Cloudflare에 올려요(wrangler.jsonc).
      - name: Cloudflare에 배포
        run: pnpm exec opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
